<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BianDuD · 博客</title>
  <style>
    :root { --ink:#1a1a1a; --paper:#faf9f6; --muted:#8a8a8a; --line:#e5e2da; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--paper); color:var(--ink);
      font-family:-apple-system,"PingFang SC","Noto Serif SC",Georgia,serif;
      line-height:1.8; padding:12vh 8vw;
    }
    .wrap { max-width:620px; margin:0 auto; }
    h1 { font-size:2.2rem; font-weight:600; letter-spacing:.02em; margin-bottom:.6rem; }
    .intro { color:var(--muted); font-size:1rem; margin-bottom:4rem; }
    h2 { font-size:.82rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase;
         color:var(--muted); margin-bottom:1.4rem; }
    article { padding:1.2rem 1.2rem; border-top:1px solid var(--line); }
    article {
  padding: 1.5rem 2rem;
  background: #f5f2ea;      /* ← 这一行是「卡片感」的关键 */
  border-radius: 12px;
  border-top: none;
  }
  .posts {
    display: flex;
    gap: 1.5rem;
  }
  .posts article {
    flex: 1;
  }
    article:last-child { border-bottom:1px solid var(--line); }
    .date { font-size:.78rem; color:var(--muted); letter-spacing:.08em;
            font-family:ui-monospace,Menlo,monospace; }
    h3 { font-size:1.15rem; font-weight:500; margin:.3rem 0 .2rem; }
    h3 a { color:var(--ink); text-decoration:none; }
    h3 a:hover { text-decoration:underline; text-underline-offset:4px; }
    footer { margin-top:4rem; font-size:.78rem; color:var(--muted); letter-spacing:.05em; }
    .avatar { width:88px; height:88px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 1.2rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="avatar" src="avatar.png" alt="我的小鲸鱼">
    <h1>BianDuD</h1>
    <p class="intro">向deepseek学习的第一天</p>
    
    <h2>文章</h2>
    <div class="posts">
    <article>
      <div class="date">2026.10.21</div>
      <h3><a href="post-1.html">第一篇：我为什么会做这个博客</a></h3>
      <p>从一个三件套和一个免费的网址开始。</p>
    </article>
    <article>
      <div class="date">2026.10.22</div>
      <h3><a href="#">第二篇：标题可以随便改</a></h3>
      <p>东南西北</p>
    </article>
      </div>
    <p style="margin-top:3rem; font-size:.9rem;">
      <a href="english.html" style="color:#8a8a8a; text-decoration:none;">English 词汇表 →</a>
    </p>
    <footer>由一个人手写的 HTML · 没有框架，没有依赖。</footer>
  </div>
</body>
</html>
